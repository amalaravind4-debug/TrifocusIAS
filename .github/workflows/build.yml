          object ScreenTimeTracker {
              fun hasUsagePermission(context: Context): Boolean {
                  val appOps = context.getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = appOps.checkOpNoThrow(
                      AppOpsManager.OPSTR_GET_USAGE_STATS,
                      Process.myUid(),
                      context.packageName
                  )
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              fun isIgnoringBatteryOptimizations(context: Context): Boolean {
                  val pm = context.getSystemService(Context.POWER_SERVICE) as PowerManager
                  return pm.isIgnoringBatteryOptimizations(context.packageName)
              }

              fun getTodayScreenMinutes(context: Context): Int {
                  if (!hasUsagePermission(context)) return 0
                  val usageStatsManager =
                      context.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, 0)
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }
                  val stats = usageStatsManager.queryUsageStats(
                      UsageStatsManager.INTERVAL_DAILY,
                      cal.timeInMillis,
                      System.currentTimeMillis()
                  )
                  val totalMillis = stats?.sumOf { it.totalTimeInForeground } ?: 0L
                  return (totalMillis / 60000L).toInt()
              }
          }

          object AlarmScheduler {

              fun scheduleTaskAlarm(context: Context, task: TaskItem) {
                  if (task.isCompleted) {
                      cancelTaskAlarm(context, task.id)
                      return
                  }
                  val parts = task.timeString.split(":")
                  if (parts.size != 2) return
                  val hour = parts[0].toIntOrNull() ?: return
                  val minute = parts[1].toIntOrNull() ?: return

                  val now = Calendar.getInstance()
                  val calendar = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, hour)
                      set(Calendar.MINUTE, minute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                      if (task.isTomorrow) {
                          add(Calendar.DAY_OF_YEAR, 1)
                      } else if (before(now)) {
                          add(Calendar.DAY_OF_YEAR, 1)
                      }
                  }

                  val intent = Intent(context, ReminderReceiver::class.java).apply {
                      putExtra("TITLE", "[${task.category.label}] ${task.title}")
                      putExtra("MESSAGE", "Scheduled block started! Tap 'Mark Done' when completed.")
                      putExtra("NOTIFICATION_ID", task.id.hashCode())
                      putExtra("TASK_ID", task.id)
                  }

                  val pendingIntent = PendingIntent.getBroadcast(
                      context,
                      task.id.hashCode(),
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  setExactSafe(context, calendar.timeInMillis, pendingIntent)
              }

              fun scheduleSnoozeAlarm(context: Context, task: TaskItem, snoozeMinutes: Int) {
                  val triggerAt = System.currentTimeMillis() + (snoozeMinutes * 60 * 1000L)
                  val intent = Intent(context, ReminderReceiver::class.java).apply {
                      putExtra("TITLE", "SNOOZE UP: [${task.category.label}] ${task.title}")
                      putExtra("MESSAGE", "15-min snooze expired! Execute now and tap 'Mark Done'.")
                      putExtra("NOTIFICATION_ID", task.id.hashCode())
                      putExtra("TASK_ID", task.id)
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      context,
                      task.id.hashCode(),
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  setExactSafe(context, triggerAt, pendingIntent)
              }

              fun cancelTaskAlarm(context: Context, taskId: String) {
                  val intent = Intent(context, ReminderReceiver::class.java)
                  val pendingIntent = PendingIntent.getBroadcast(
                      context,
                      taskId.hashCode(),
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  alarmManager.cancel(pendingIntent)
              }

              fun scheduleAllRoutineAlarms(context: Context) {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val wakeHour = prefs.getInt("wake_hour", 5)
                  val wakeMin = prefs.getInt("wake_min", 30)
                  val bedHour = prefs.getInt("bed_hour", 22)
                  val bedMin = prefs.getInt("bed_min", 0)

                  val windDownCal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, bedHour)
                      set(Calendar.MINUTE, bedMin)
                      add(Calendar.MINUTE, -15)
                  }

                  scheduleExactDaily(
                      context = context,
                      hour = wakeHour,
                      minute = wakeMin,
                      requestCode = 9000,
                      title = "MORNING WAKE-UP CALL (%02d:%02d)".format(wakeHour, wakeMin),
                      message = "Tap 'I'm Awake & At Desk' to log your wake variance & unlock Morning Planner!",
                      isBedtime = false,
                      isWakeUp = true,
                      forceNextDay = false
                  )

                  scheduleExactDaily(
                      context = context,
                      hour = 13,
                      minute = 30,
                      requestCode = 9001,
                      title = "Mid-Day Executor Check-In",
                      message = "Don't let tasks pile up. Check off morning UPSC blocks & protect your afternoon.",
                      isBedtime = false,
                      isWakeUp = false,
                      forceNextDay = false
                  )

                  scheduleExactDaily(
                      context = context,
                      hour = 18,
                      minute = 30,
                      requestCode = 9002,
                      title = "Evening Progress Check",
                      message = "Wrap up Reading Room & Coding chores now so evening UPSC revision stays untouched.",
                      isBedtime = false,
                      isWakeUp = false,
                      forceNextDay = false
                  )

                  scheduleExactDaily(
                      context = context,
                      hour = windDownCal.get(Calendar.HOUR_OF_DAY),
                      minute = windDownCal.get(Calendar.MINUTE),
                      requestCode = 9003,
                      title = "15 Mins to %02d:%02d Sleep Cutoff!".format(bedHour, bedMin),
                      message = "Tap '1-Tap Rollover & Sleep' right here on the notification to auto-plan tomorrow and shut down screens.",
                      isBedtime = true,
                      isWakeUp = false,
                      forceNextDay = false
                  )

                  scheduleExactDaily(
                      context = context,
                      hour = bedHour,
                      minute = bedMin,
                      requestCode = 9004,
                      title = "%02d:%02d SLEEP LOCKOUT — PUT PHONE DOWN".format(bedHour, bedMin),
                      message = "10PM Brain Lockout active. Tap '1-Tap Rollover & Sleep' now and close your eyes!",
                      isBedtime = true,
                      isWakeUp = false,
                      forceNextDay = false
                  )

                  StorageHelper.loadTasks(context)
                      .filter { !it.isCompleted }
                      .forEach { scheduleTaskAlarm(context, it) }

                  scheduleScreenCheckPulse(context)
              }

              fun scheduleScreenCheckPulse(context: Context) {
                  val triggerAt = System.currentTimeMillis() + (15 * 60 * 1000L)
                  val intent = Intent(context, ReminderReceiver::class.java).apply {
                      action = "com.trifocus.ias.ACTION_SCREEN_CHECK"
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      context,
                      9090,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  setExactSafe(context, triggerAt, pendingIntent)
              }

              fun scheduleExactDaily(
                  context: Context,
                  hour: Int,
                  minute: Int,
                  requestCode: Int,
                  title: String,
                  message: String,
                  isBedtime: Boolean,
                  isWakeUp: Boolean,
                  forceNextDay: Boolean
              ) {
                  val now = Calendar.getInstance()
                  val calendar = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, hour)
                      set(Calendar.MINUTE, minute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                      if (forceNextDay || before(now)) {
                          add(Calendar.DAY_OF_YEAR, 1)
                      }
                  }

                  val intent = Intent(context, ReminderReceiver::class.java).apply {
                      putExtra("TITLE", title)
                      putExtra("MESSAGE", message)
                      putExtra("NOTIFICATION_ID", requestCode)
                      putExtra("RECURRING_HOUR", hour)
                      putExtra("RECURRING_MIN", minute)
                      putExtra("IS_BEDTIME", isBedtime)
                      putExtra("IS_WAKEUP", isWakeUp)
                  }

                  val pendingIntent = PendingIntent.getBroadcast(
                      context,
                      requestCode,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  setExactSafe(context, calendar.timeInMillis, pendingIntent)
              }

              private fun setExactSafe(context: Context, triggerAtMillis: Long, pendingIntent: PendingIntent) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val showIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK
                  }
                  val showPending = PendingIntent.getActivity(
                      context,
                      0,
                      showIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  try {
                      val clockInfo = AlarmManager.AlarmClockInfo(triggerAtMillis, showPending)
                      alarmManager.setAlarmClock(clockInfo, pendingIntent)
                  } catch (e: SecurityException) {
                      try {
                          alarmManager.setExactAndAllowWhileIdle(
                              AlarmManager.RTC_WAKEUP,
                              triggerAtMillis,
                              pendingIntent
                          )
                      } catch (ex: SecurityException) {
                          alarmManager.set(AlarmManager.RTC_WAKEUP, triggerAtMillis, pendingIntent)
                      }
                  }
              }
          }
