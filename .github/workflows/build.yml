                                      Toast.makeText(
                                          context,
                                          "Wake Check-In Recorded (Variance: ${variance}m)",
                                          Toast.LENGTH_SHORT
                                      ).show()
                                  }
                              )
                          }

                          DashboardSection.CABIN -> {
                              CabinAccountabilitySection(
                                  context = context,
                                  cabinSeatId = cabinSeatId,
                                  cabinManagerName = cabinManagerName,
                                  cabinCheckInStamp = cabinCheckInStamp,
                                  cabinDeepMins = cabinDeepMins,
                                  isSessionActive = isCabinSessionActive,
                                  isGuardianLocked = isGuardianLocked,
                                  lastWakeConfirm = lastWakeConfirm,
                                  completedToday = completedToday,
                                  totalToday = todayTasks.size,
                                  habitsDone = habits.count { it.isDone },
                                  habitsTotal = habits.size,
                                  screenMinutes = screenMinutes,
                                  screenLimitMins = screenLimitMins,
                                  tamperCount = tamperCount,
                                  onUpdateCabinConfig = { newSeat, newMgr ->
                                      runProtected("Change Reading Room Cabin Seat / Manager") {
                                          StorageHelper.setCabinConfig(context, newSeat, newMgr)
                                          refreshAllState()
                                      }
                                  },
                                  onToggleCabinSession = {
                                      StorageHelper.toggleCabinDeepSession(context)
                                      refreshAllState()
                                  }
                              )
                          }

                          DashboardSection.AUDIT -> {
                              ZeroCheatProtocolAndAuditSection(
                                  context = context,
                                  hasUsageAccess = hasUsageAccess,
                                  isBatteryUnrestricted = isBatteryUnrestricted,
                                  isGuardianLocked = isGuardianLocked,
                                  partnerName = partnerName,
                                  wakeHour = wakeHour,
                                  wakeMin = wakeMin,
                                  bedHour = bedHour,
                                  bedMin = bedMin,
                                  screenLimitMins = screenLimitMins,
                                  tamperCount = tamperCount,
                                  lastTamperLog = lastTamperLog,
                                  lastSundayAudit = lastSundayAudit,
                                  analytics = analytics,
                                  completedToday = completedToday,
                                  totalToday = todayTasks.size,
                                  cabinSeatId = cabinSeatId,
                                  cabinDeepMins = cabinDeepMins,
                                  onOpenGuardianModal = { showGuardianModal = true },
                                  onPartnerSignOffSunday = {
                                      runProtected("Partner 60-Second Sunday Audit Sign-Off") {
                                          GuardianLockManager.signOffSundayAudit(context)
                                          refreshAllState()
                                          Toast.makeText(
                                              context,
                                              "Sunday Audit Verified & Signed Off by $partnerName!",
                                              Toast.LENGTH_LONG
                                          ).show()
                                      }
                                  }
                              )
                          }
                      }
                  }
              }

              if (showAddDialog) {
                  AddOrEditTaskModal(
                      existingTask = editingTask,
                      defaultTomorrow = showTomorrowTab,
                      onDismiss = {
                          showAddDialog = false
                          editingTask = null
                      },
                      onSave = { savedTask ->
                          val updated = if (editingTask != null) {
                              tasks.map { if (it.id == savedTask.id) savedTask else it }
                          } else {
                              tasks + savedTask
                          }
                          tasks = updated
                          StorageHelper.saveTasks(context, updated)
                          AlarmScheduler.scheduleTaskAlarm(context, savedTask)
                          showAddDialog = false
                          editingTask = null
                      }
                  )
              }

              if (showScheduleModal) {
                  ScheduleAndSleepModal(
                      isLocked = isGuardianLocked,
                      wakeHour = wakeHour,
                      wakeMin = wakeMin,
                      bedHour = bedHour,
                      bedMin = bedMin,
                      screenLimitMins = screenLimitMins,
                      unfinishedCount = todayTasks.count { !it.isCompleted },
                      onUpdateWakeTime = { h, m ->
                          runProtected("Change Morning Wake-Up Time") {
                              wakeHour = h
                              wakeMin = m
                              prefs.edit().putInt("wake_hour", h).putInt("wake_min", m).apply()
                              AlarmScheduler.scheduleAllRoutineAlarms(context)
                              Toast.makeText(
                                  context,
                                  "Morning Wake-Up set to %02d:%02d".format(h, m),
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      },
                      onUpdateBedtime = { h, m ->
                          runProtected("Change Night Sleep Cutoff Time") {
                              bedHour = h
                              bedMin = m
                              prefs.edit().putInt("bed_hour", h).putInt("bed_min", m).apply()
                              AlarmScheduler.scheduleAllRoutineAlarms(context)
                              Toast.makeText(
                                  context,
                                  "Sleep Cutoff set to %02d:%02d (with 15m wind-down)".format(h, m),
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      },
                      onUpdateScreenLimit = { newLimit ->
                          runProtected("Change Daily Screen Time Limit") {
                              screenLimitMins = newLimit
                              prefs.edit().putInt("screen_limit_mins", newLimit).apply()
                              refreshAllState()
                              Toast.makeText(
                                  context,
                                  "Screen Time Limit set to $newLimit mins",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      },
                      onLogWakeUpNow = {
                          val variance = StorageHelper.recordMorningWakeCheckIn(context)
                          refreshAllState()
                          Toast.makeText(context, "Wake-Up Logged (Variance: ${variance}m)!", Toast.LENGTH_SHORT).show()
                      },
                      onRolloverAndStartNewDay = {
                          if (currentHour >= 20 || currentHour < 4) {
                              StorageHelper.performLazyNightRollover(context)
                              refreshAllState()
                              showScheduleModal = false
                              showTomorrowTab = false
                              Toast.makeText(
                                  context,
                                  "Tomorrow's Plan Activated! Put your phone away.",
                                  Toast.LENGTH_LONG
                              ).show()
                          } else {
                              runProtected("Perform Daytime Task Rollover") {
                                  StorageHelper.performLazyNightRollover(context)
                                  refreshAllState()
                                  showScheduleModal = false
                                  showTomorrowTab = false
                              }
                          }
                      },
                      onDismiss = { showScheduleModal = false }
                  )
              }

              if (showGuardianModal) {
                  GuardianLockModal(
                      isLocked = isGuardianLocked,
                      hasExistingPassword = GuardianLockManager.hasPasswordSet(context),
                      currentPartnerName = partnerName,
                      currentLockAddTasks = GuardianLockManager.getAddTaskLockedPref(context),
                      currentEnforceBrainSplit = GuardianLockManager.isBrainSplitEnforced(context),
                      tamperCount = tamperCount,
                      lastTamperLog = lastTamperLog,
                      lastWakeConfirm = lastWakeConfirm,
                      onSetPasswordAndLock = { partner, pass, lockAdd, brainSplit ->
                          GuardianLockManager.setGuardianPasswordAndLock(
                              context,
                              partner,
                              pass,
                              lockAdd,
                              brainSplit
                          )
                          refreshAllState()
                          showGuardianModal = false
                          Toast.makeText(
                              context,
                              "Guardian Lock Armed by $partner! 6AM/10PM Split Active.",
                              Toast.LENGTH_LONG
                          ).show()
                      },
                      onRelockExisting = {
                          GuardianLockManager.lockExisting(context)
                          refreshAllState()
                          showGuardianModal = false
                          Toast.makeText(context, "Guardian Lock Re-Armed!", Toast.LENGTH_SHORT).show()
                      },
                      onAttemptUnlock = { candidate ->
                          val ok = GuardianLockManager.verifyAndUnlock(context, candidate)
                          refreshAllState()
                          if (ok) {
                              showGuardianModal = false
                              Toast.makeText(context, "Unlocked by Accountability Partner", Toast.LENGTH_SHORT).show()
                          } else {
                              Toast.makeText(context, "WRONG PASSWORD! Tamper attempt logged.", Toast.LENGTH_LONG).show()
                          }
                      },
                      onResetTamper = {
                          GuardianLockManager.signOffSundayAudit(context)
                          refreshAllState()
                      },
                      onDismiss = { showGuardianModal = false }
                  )
              }

              if (pendingProtectedAction != null) {
                  GuardianActionVerifyDialog(
                      actionLabel = pendingActionLabel,
                      partnerName = partnerName,
                      onVerify = { pass ->
                          if (GuardianLockManager.verifyActionPassword(context, pass)) {
                              val action = pendingProtectedAction
                              pendingProtectedAction = null
                              action?.invoke()
                              refreshAllState()
                          } else {
                              refreshAllState()
                              Toast.makeText(
                                  context,
                                  "Access Denied! Wrong Partner Password (Tamper Logged).",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      },
                      onDismiss = { pendingProtectedAction = null }
                  )
              }
          }

          @Composable
          fun BrainSeparationBanner(
              brainModeLabel: String,
