                  } else {
                      "Not checked in"
                  }
              }

              fun isCabinSessionActive(context: Context): Boolean {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  return prefs.getLong(KEY_CABIN_SESSION_START, 0L) > 0L
              }

              fun getTodayCabinDeepMinutes(context: Context): Int {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val today = Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                  val saved = if (prefs.getInt(KEY_CABIN_CHECKIN_DAY, -1) == today) {
                      prefs.getInt(KEY_CABIN_DEEP_MINS, 0)
                  } else {
                      0
                  }
                  val activeStart = prefs.getLong(KEY_CABIN_SESSION_START, 0L)
                  val runningMins = if (activeStart > 0L) {
                      ((System.currentTimeMillis() - activeStart) / 60000L).toInt().coerceAtLeast(0)
                  } else {
                      0
                  }
                  return saved + runningMins
              }

              fun toggleCabinDeepSession(context: Context) {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val today = Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                  val activeStart = prefs.getLong(KEY_CABIN_SESSION_START, 0L)

                  if (activeStart <= 0L) {
                      val stamp = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                      val editor = prefs.edit()
                          .putLong(KEY_CABIN_SESSION_START, System.currentTimeMillis())
                      if (prefs.getInt(KEY_CABIN_CHECKIN_DAY, -1) != today) {
                          editor.putInt(KEY_CABIN_CHECKIN_DAY, today)
                              .putString(KEY_CABIN_CHECKIN_STAMP, stamp)
                              .putInt(KEY_CABIN_DEEP_MINS, 0)
                      }
                      editor.apply()
                  } else {
                      val elapsedMins = ((System.currentTimeMillis() - activeStart) / 60000L).toInt().coerceAtLeast(1)
                      val prev = if (prefs.getInt(KEY_CABIN_CHECKIN_DAY, -1) == today) {
                          prefs.getInt(KEY_CABIN_DEEP_MINS, 0)
                      } else {
                          0
                      }
                      prefs.edit()
                          .putLong(KEY_CABIN_SESSION_START, 0L)
                          .putInt(KEY_CABIN_DEEP_MINS, prev + elapsedMins)
                          .apply()
                  }
              }

              fun performLazyNightRollover(context: Context) {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val screenUsed = ScreenTimeTracker.getTodayScreenMinutes(context)
                  val screenCap = prefs.getInt("screen_limit_mins", 60)
                  val daysTracked = prefs.getInt(KEY_DAYS_TRACKED, 1) + 1
                  val daysUnder = prefs.getInt(KEY_DAYS_UNDER_CAP, 1) + if (screenUsed <= screenCap) 1 else 0
                  prefs.edit()
                      .putInt(KEY_DAYS_TRACKED, daysTracked)
                      .putInt(KEY_DAYS_UNDER_CAP, daysUnder)
                      .putLong(KEY_CABIN_SESSION_START, 0L)
                      .apply()

                  val current = loadTasks(context)
                  current.filter { it.isCompleted }.forEach {
                      AlarmScheduler.cancelTaskAlarm(context, it.id)
                  }

                  val carriedOver = current.mapNotNull { task ->
                      when {
                          !task.isTomorrow && task.isCompleted -> null
                          !task.isTomorrow && !task.isCompleted -> task.copy(isTomorrow = false)
                          task.isTomorrow -> task.copy(isTomorrow = false)
                          else -> null
                      }
                  }.toMutableList()

                  val defaults = defaultSampleTasks()
                  defaults.forEach { defTask ->
                      if (carriedOver.none { it.title == defTask.title }) {
                          carriedOver.add(defTask)
                      }
                  }

                  saveTasks(context, carriedOver)
                  val resetHabits = loadHabits(context).map { it.copy(isDone = false) }
                  saveHabits(context, resetHabits)
                  AlarmScheduler.scheduleAllRoutineAlarms(context)
              }

              fun saveTasks(context: Context, tasks: List<TaskItem>) {
                  val array = JSONArray()
                  tasks.forEach { t ->
                      array.put(JSONObject().apply {
                          put("id", t.id)
                          put("title", t.title)
                          put("category", t.category.name)
                          put("timeString", t.timeString)
                          put("isCompleted", t.isCompleted)
                          put("isTomorrow", t.isTomorrow)
                      })
                  }
                  context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                      .edit().putString(KEY_TASKS, array.toString()).apply()
              }

              fun loadTasks(context: Context): List<TaskItem> {
                  val raw = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                      .getString(KEY_TASKS, null) ?: return defaultSampleTasks()
                  return try {
                      val array = JSONArray(raw)
                      List(array.length()) { i ->
                          val obj = array.getJSONObject(i)
                          TaskItem(
                              id = obj.getString("id"),
                              title = obj.getString("title"),
                              category = PillarCategory.valueOf(obj.getString("category")),
                              timeString = obj.getString("timeString"),
                              isCompleted = obj.getBoolean("isCompleted"),
                              isTomorrow = obj.optBoolean("isTomorrow", false)
                          )
                      }
                  } catch (e: Exception) {
                      defaultSampleTasks()
                  }
              }

              fun saveHabits(context: Context, habits: List<IasHabit>) {
                  val array = JSONArray()
                  habits.forEach { h ->
                      array.put(JSONObject().apply {
                          put("id", h.id)
                          put("title", h.title)
                          put("isDone", h.isDone)
                      })
                  }
                  context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                      .edit().putString(KEY_HABITS, array.toString()).apply()
              }

              fun loadHabits(context: Context): List<IasHabit> {
                  val raw = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                      .getString(KEY_HABITS, null) ?: return defaultIasHabits()
                  return try {
                      val array = JSONArray(raw)
                      List(array.length()) { i ->
                          val obj = array.getJSONObject(i)
                          IasHabit(
                              id = obj.getString("id"),
                              title = obj.getString("title"),
                              isDone = obj.getBoolean("isDone")
                          )
                      }
                  } catch (e: Exception) {
                      defaultIasHabits()
                  }
              }

              private fun defaultIasHabits() = listOf(
                  IasHabit("ca", "Newspaper & CA", false),
                  IasHabit("gs", "GS Static Block", false),
                  IasHabit("opt", "Optional Subject", false),
                  IasHabit("aw", "Answer Writing", false),
                  IasHabit("rev", "Active Recall", false)
              )

              private fun defaultSampleTasks() = listOf(
                  TaskItem(
                      title = "Morning Optional Deep Work (No Phone)",
                      category = PillarCategory.UPSC,
                      timeString = "06:30"
                  ),
                  TaskItem(
                      title = "Reading Room Morning Check & Seat Ops",
                      category = PillarCategory.READING_ROOM,
                      timeString = "09:30"
                  ),
                  TaskItem(
                      title = "GS Core + Newspaper Editorial Notes",
                      category = PillarCategory.UPSC,
                      timeString = "11:00"
                  ),
                  TaskItem(
                      title = "Time-Boxed Coding Sprint (Strict 60m Cap)",
                      category = PillarCategory.CODING,
                      timeString = "15:30"
                  ),
                  TaskItem(
                      title = "Evening Mains Answer Writing & Revision",
                      category = PillarCategory.UPSC,
                      timeString = "19:30"
                  )
              )
          }
          EOF

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Ready-to-Install Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK to Repository Root
        run: cp app/build/outputs/apk/debug/app-debug.apk TriFocus-IAS-v4.apk

      - name: Commit APK & 1-Tap Download Button Directly to Repo
        shell: bash
        run: |
          cat << 'EOF' > README.md
          # 📲 TriFocus IAS v4.0 — Guardian & Cabin Edition

          ### 👉 [TAP HERE FOR 1-CLICK APK DOWNLOAD (DIRECT FROM REPO)](../../raw/HEAD/TriFocus-IAS-v4.apk)

          ### 👉 [ALTERNATE DOWNLOAD (FROM GITHUB RELEASES)](../../releases/latest/download/TriFocus-IAS-v4.apk)

          ---
          **Or look in the file list right above this README:** tap **`TriFocus-IAS-v4.apk`** -> tap **Download raw file** (or the three dots `...` -> **Download**).
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f TriFocus-IAS-v4.apk README.md
          git commit -m "Publish compiled TriFocus-IAS-v4.apk directly to repo [skip ci]" || true
          git push || true

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TriFocus-IAS-APK
          path: TriFocus-IAS-v4.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v4.0-run-${{ github.run_number }}
          name: "TriFocus IAS v4.0 - Guardian & Cabin Edition"
          body: "Tap **TriFocus-IAS-v4.apk** under Assets below to download and install directly on your Android phone."
          files: TriFocus-IAS-v4.apk
