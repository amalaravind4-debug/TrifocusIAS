          @Composable
          fun AddOrEditTaskModal(
              existingTask: TaskItem?,
              defaultTomorrow: Boolean,
              onDismiss: () -> Unit,
              onSave: (TaskItem) -> Unit
          ) {
              val context = LocalContext.current
              var title by remember { mutableStateOf(existingTask?.title ?: "") }
              var category by remember { mutableStateOf(existingTask?.category ?: PillarCategory.UPSC) }
              var timeString by remember { mutableStateOf(existingTask?.timeString ?: "09:00") }
              var isTomorrow by remember { mutableStateOf(existingTask?.isTomorrow ?: defaultTomorrow) }

              val quickTemplates = listOf(
                  Triple("PSIR Optional Study Block", PillarCategory.UPSC, "06:30"),
                  Triple("Reading Room Seat & Power Check", PillarCategory.READING_ROOM, "09:30"),
                  Triple("GS Static + Newspaper Notes", PillarCategory.UPSC, "11:00"),
                  Triple("Time-Boxed Coding Sprint (60m)", PillarCategory.CODING, "15:30"),
                  Triple("Mains Answer Writing + Revision", PillarCategory.UPSC, "19:30")
              )

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(if (existingTask != null) "Edit Scheduled Task" else "Morning Planner: Add Block") },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          if (existingTask == null) {
                              Text("1-Tap Presets (Zero Typing):", fontSize = 12.sp, color = Color(0xFF81C784))
                              Row(
                                  modifier = Modifier.horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  quickTemplates.forEach { (tplTitle, tplCat, tplTime) ->
                                      AssistChip(
                                          onClick = {
                                              title = tplTitle
                                              category = tplCat
                                              timeString = tplTime
                                          },
                                          label = { Text(tplTitle, fontSize = 11.sp) }
                                      )
                                  }
                              }
                          }

                          OutlinedTextField(
                              value = title,
                              onValueChange = { title = it },
                              label = { Text("Task Name") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )

                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              PillarCategory.entries.forEach { cat ->
                                  FilterChip(
                                      selected = category == cat,
                                      onClick = { category = cat },
                                      label = { Text(cat.label, fontSize = 11.sp) }
                                  )
                              }
                          }

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text("Exact Alarm: $timeString", fontWeight = FontWeight.Bold)
                              OutlinedButton(onClick = {
                                  val parts = timeString.split(":")
                                  val initH = parts.getOrNull(0)?.toIntOrNull() ?: 9
                                  val initM = parts.getOrNull(1)?.toIntOrNull() ?: 0
