          object StorageHelper {
              private const val KEY_TASKS = "saved_tasks_json_v4"
              private const val KEY_HABITS = "saved_habits_json_v4"
              private const val KEY_SNOOZE_DAY = "snooze_day_of_year"
              private const val KEY_SNOOZE_MAP = "snooze_counts_json"
              private const val KEY_TOTAL_30D_SNOOZES = "total_30d_snoozes"
              private const val KEY_WAKE_VARIANCE_TODAY = "wake_variance_today"
              private const val KEY_WAKE_VARIANCE_HISTORY = "wake_variance_history_json"
              private const val KEY_POST_CUTOFF_DRIFT_30D = "post_cutoff_drift_mins_30d"
              private const val KEY_LAST_DRIFT_RECORD_DAY = "last_drift_record_day"
              private const val KEY_DAYS_TRACKED = "days_tracked_count"
              private const val KEY_DAYS_UNDER_CAP = "days_under_cap_count"

              private const val KEY_CABIN_SEAT_ID = "cabin_seat_id"
              private const val KEY_CABIN_MANAGER = "cabin_manager_name"
              private const val KEY_CABIN_CHECKIN_DAY = "cabin_checkin_day"
              private const val KEY_CABIN_CHECKIN_STAMP = "cabin_checkin_stamp"
              private const val KEY_CABIN_DEEP_MINS = "cabin_deep_mins_today"
              private const val KEY_CABIN_SESSION_START = "cabin_session_start_millis"

              fun recordMorningWakeCheckIn(context: Context): Int {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val wakeH = prefs.getInt("wake_hour", 5)
                  val wakeM = prefs.getInt("wake_min", 30)
                  val now = Calendar.getInstance()
                  val nowMins = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE)
                  val targetMins = wakeH * 60 + wakeM
                  val variance = (nowMins - targetMins).coerceIn(-180, 360)

                  val stamp = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                  val historyRaw = prefs.getString(KEY_WAKE_VARIANCE_HISTORY, "[]") ?: "[]"
                  val arr = try { JSONArray(historyRaw) } catch (e: Exception) { JSONArray() }
                  arr.put(variance)
                  val trimmed = JSONArray()
                  val startIdx = (arr.length() - 30).coerceAtLeast(0)
                  for (i in startIdx until arr.length()) {
                      trimmed.put(arr.getInt(i))
                  }

                  val varBadge = if (variance <= 0) "${variance}m" else "+${variance}m"
                  prefs.edit()
                      .putString("last_wake_confirm", "$stamp ($varBadge)")
                      .putInt("last_wake_day", now.get(Calendar.DAY_OF_YEAR))
                      .putInt(KEY_WAKE_VARIANCE_TODAY, variance)
                      .putString(KEY_WAKE_VARIANCE_HISTORY, trimmed.toString())
                      .apply()
                  return variance
              }

              fun getSnoozeCountToday(context: Context, taskId: String): Int {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val today = Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                  if (prefs.getInt(KEY_SNOOZE_DAY, -1) != today) return 0
                  val raw = prefs.getString(KEY_SNOOZE_MAP, "{}") ?: "{}"
                  return try {
                      JSONObject(raw).optInt(taskId, 0)
                  } catch (e: Exception) {
                      0
                  }
              }

              fun getTotalSnoozesTodayAllTasks(context: Context): Int {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val today = Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                  if (prefs.getInt(KEY_SNOOZE_DAY, -1) != today) return 0
                  val raw = prefs.getString(KEY_SNOOZE_MAP, "{}") ?: "{}"
                  return try {
                      val obj = JSONObject(raw)
                      var sum = 0
                      val keys = obj.keys()
                      while (keys.hasNext()) {
                          val k = keys.next()
                          sum += obj.optInt(k, 0)
                      }
                      sum
                  } catch (e: Exception) {
                      0
                  }
              }

              fun incrementSnoozeCountToday(context: Context, taskId: String) {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val today = Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                  val obj = if (prefs.getInt(KEY_SNOOZE_DAY, -1) == today) {
                      try {
                          JSONObject(prefs.getString(KEY_SNOOZE_MAP, "{}") ?: "{}")
                      } catch (e: Exception) {
                          JSONObject()
                      }
                  } else {
                      JSONObject()
                  }
                  obj.put(taskId, obj.optInt(taskId, 0) + 1)
                  val total30d = prefs.getInt(KEY_TOTAL_30D_SNOOZES, 0) + 1
                  prefs.edit()
                      .putInt(KEY_SNOOZE_DAY, today)
                      .putString(KEY_SNOOZE_MAP, obj.toString())
                      .putInt(KEY_TOTAL_30D_SNOOZES, total30d)
                      .apply()
              }

              fun recordPostCutoffDriftPulse(context: Context, totalScreenMinsToday: Int) {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val limit = prefs.getInt("screen_limit_mins", 60)
                  val today = Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                  if (totalScreenMinsToday > limit && prefs.getInt(KEY_LAST_DRIFT_RECORD_DAY, -1) != today) {
                      val overflow = (totalScreenMinsToday - limit).coerceAtMost(120)
                      val prev = prefs.getInt(KEY_POST_CUTOFF_DRIFT_30D, 0)
                      prefs.edit()
                          .putInt(KEY_POST_CUTOFF_DRIFT_30D, prev + overflow)
                          .putInt(KEY_LAST_DRIFT_RECORD_DAY, today)
                          .apply()
                  }
              }

              fun getLeakageAnalytics(
                  context: Context,
                  todayScreenMins: Int,
                  screenLimitMins: Int
              ): LeakageAnalyticsSnapshot {
                  val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                  val today = Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                  val wakeDay = prefs.getInt("last_wake_day", -1)
                  val todayWakeVar = if (wakeDay == today) prefs.getInt(KEY_WAKE_VARIANCE_TODAY, 0) else -999

                  val histRaw = prefs.getString(KEY_WAKE_VARIANCE_HISTORY, "[]") ?: "[]"
                  val avgVar = try {
                      val arr = JSONArray(histRaw)
                      if (arr.length() == 0) 0
                      else {
                          var sum = 0
                          for (i in 0 until arr.length()) sum += kotlin.math.abs(arr.getInt(i))
                          sum / arr.length()
                      }
                  } catch (e: Exception) {
                      0
                  }

                  val todaySnoozes = getTotalSnoozesTodayAllTasks(context)
                  val total30dSnoozes = prefs.getInt(KEY_TOTAL_30D_SNOOZES, todaySnoozes)
                  val snoozeLeakMins = total30dSnoozes * 15
                  val driftMins = prefs.getInt(KEY_POST_CUTOFF_DRIFT_30D, 0)

                  val trackedDays = prefs.getInt(KEY_DAYS_TRACKED, 1).coerceAtLeast(1)
                  val baseUnderCap = prefs.getInt(KEY_DAYS_UNDER_CAP, 1)
                  val effectiveUnderCap = if (todayScreenMins <= screenLimitMins) {
                      baseUnderCap.coerceAtLeast(1)
                  } else {
                      (baseUnderCap - 1).coerceAtLeast(0)
                  }

                  val leakedHours = (snoozeLeakMins + driftMins) / 60f
                  val netProtected = (37.5f - leakedHours).coerceAtLeast(0f)

                  return LeakageAnalyticsSnapshot(
                      todayWakeVarianceMins = todayWakeVar,
                      avgWakeVarianceMins = avgVar,
                      todaySnoozeCount = todaySnoozes,
                      total30DaySnoozes = total30dSnoozes,
                      snoozeLeakMinutes30d = snoozeLeakMins,
                      postCutoffDriftMins30d = driftMins,
                      daysUnderScreenCap = effectiveUnderCap,
                      totalTrackedDays = trackedDays,
                      netUpscHoursRecovered30d = netProtected
                  )
              }

