          @Composable
          fun ColumnScope.PlannerSectionContent(
              context: Context,
              isBatteryUnrestricted: Boolean,
              currentHour: Int,
              bedHour: Int,
              bedMin: Int,
              wakeHour: Int,
              wakeMin: Int,
              hasUsageAccess: Boolean,
              screenMinutes: Int,
              screenLimitMins: Int,
              habits: List<IasHabit>,
              tasks: List<TaskItem>,
              todayTasks: List<TaskItem>,
              completedToday: Int,
              showTomorrowTab: Boolean,
              selectedFilter: PillarCategory?,
              isGuardianLocked: Boolean,
              onToggleTomorrowTab: (Boolean) -> Unit,
              onSelectFilter: (PillarCategory?) -> Unit,
              onRefresh: () -> Unit,
              onRunProtected: (String, () -> Unit) -> Unit,
              onEditTask: (TaskItem) -> Unit
          ) {
              if (!isBatteryUnrestricted) {
                  Card(
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF332610)),
                      shape = RoundedCornerShape(10.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(bottom = 8.dp)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(10.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  "Step 1 Protocol: Unrestricted Battery Needed",
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 12.sp,
                                  color = Color(0xFFFFD54F)
                              )
                              Text(
                                  "Allow unrestricted battery so Android never delays your alarms.",
                                  fontSize = 11.sp,
                                  color = Color.LightGray
                              )
                          }
                          OutlinedButton(
                              onClick = {
                                  val intent = Intent(
                                      Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                      Uri.parse("package:${context.packageName}")
                                  )
                                  context.startActivity(intent)
                              }
                          ) {
                              Text("Allow", fontSize = 11.sp)
                          }
                      }
                  }
              }

              if (currentHour >= bedHour || currentHour < wakeHour) {
                  Card(
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFB71C1C)),
                      shape = RoundedCornerShape(12.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(bottom = 8.dp)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(12.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  "PAST %02d:%02d SLEEP CUTOFF!".format(bedHour, bedMin),
                                  fontWeight = FontWeight.ExtraBold,
                                  color = Color.White,
                                  fontSize = 13.sp
                              )
                              Text(
                                  "10:30 PM brain cannot renegotiate. Tap 1-Tap Sleep & lock phone.",
                                  color = Color(0xFFFFCDD2),
                                  fontSize = 11.sp
                              )
                          }
                          Button(
                              onClick = {
                                  StorageHelper.performLazyNightRollover(context)
                                  onRefresh()
                                  Toast.makeText(
                                      context,
                                      "Tomorrow Locked! Goodnight!",
                                      Toast.LENGTH_LONG
                                  ).show()
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color.White)
                          ) {
                              Text("1-Tap Sleep", color = Color(0xFFB71C1C), fontWeight = FontWeight.Bold, fontSize = 11.sp)
                          }
                      }
                  }
              }

              ScreenTimeBudgetCard(
                  hasPermission = hasUsageAccess,
                  usedMinutes = screenMinutes,
                  limitMinutes = screenLimitMins,
                  onGrantPermission = {
                      context.startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                  }
              )

              Spacer(modifier = Modifier.height(8.dp))

              IasNonNegotiablesCard(
                  habits = habits,
                  isLocked = isGuardianLocked,
                  onToggleHabit = { habit ->
                      if (habit.isDone && isGuardianLocked) {
                          onRunProtected("Uncheck Completed Habit '${habit.title}'") {
                              val updated = habits.map {
                                  if (it.id == habit.id) it.copy(isDone = false) else it
                              }
                              StorageHelper.saveHabits(context, updated)
                              onRefresh()
                          }
                      } else {
                          val updated = habits.map {
                              if (it.id == habit.id) it.copy(isDone = !it.isDone) else it
                          }
                          StorageHelper.saveHabits(context, updated)
                          onRefresh()
                      }
                  },
                  onResetHabits = {
                      onRunProtected("Reset Daily Non-Negotiable Habits") {
                          val updated = habits.map { it.copy(isDone = false) }
                          StorageHelper.saveHabits(context, updated)
                          onRefresh()
                      }
                  }
              )

              Spacer(modifier = Modifier.height(8.dp))

              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      FilterChip(
                          selected = !showTomorrowTab,
                          onClick = { onToggleTomorrowTab(false) },
                          label = { Text("Today ($completedToday/${todayTasks.size})") }
                      )
                      FilterChip(
                          selected = showTomorrowTab,
                          onClick = { onToggleTomorrowTab(true) },
                          label = { Text("Tomorrow (${tasks.count { it.isTomorrow }})") }
                      )
                  }
                  TextButton(
                      onClick = {
                          if (currentHour in 20..23) {
                              StorageHelper.performLazyNightRollover(context)
                              onRefresh()
                              Toast.makeText(context, "Night Rollover Complete!", Toast.LENGTH_SHORT).show()
                          } else {
                              onRunProtected("Daytime Rollover / Auto-Fill Reset") {
                                  StorageHelper.performLazyNightRollover(context)
                                  onRefresh()
                                  Toast.makeText(context, "Default Day Auto-Filled!", Toast.LENGTH_SHORT).show()
                              }
                          }
                      }
                  ) {
                      Text("Rollover / Fill", fontSize = 12.sp, color = Color(0xFF81C784))
                  }
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .horizontalScroll(rememberScrollState()),
                  horizontalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  FilterChip(
                      selected = selectedFilter == null,
                      onClick = { onSelectFilter(null) },
                      label = { Text("All Roles") }
                  )
                  PillarCategory.entries.forEach { cat ->
                      FilterChip(
                          selected = selectedFilter == cat,
                          onClick = { onSelectFilter(if (selectedFilter == cat) null else cat) },
                          label = { Text(cat.label) }
                      )
                  }
              }

              Spacer(modifier = Modifier.height(6.dp))

              val visibleTasks = tasks
                  .filter { it.isTomorrow == showTomorrowTab }
                  .filter { selectedFilter == null || it.category == selectedFilter }
                  .sortedBy { it.timeString }

              LazyColumn(
                  modifier = Modifier.weight(1f),
                  verticalArrangement = Arrangement.spacedBy(8.dp),
                  contentPadding = PaddingValues(bottom = 88.dp)
              ) {
                  items(visibleTasks, key = { it.id }) { task ->
                      TaskRowCard(
                          task = task,
                          isLocked = isGuardianLocked,
                          onToggle = {
                              if (task.isCompleted && isGuardianLocked) {
                                  onRunProtected("Uncheck Completed Task '${task.title}'") {
                                      val updated = tasks.map {
                                          if (it.id == task.id) it.copy(isCompleted = false) else it
                                      }
                                      StorageHelper.saveTasks(context, updated)
                                      updated.find { it.id == task.id }?.let {
                                          AlarmScheduler.scheduleTaskAlarm(context, it)
                                      }
                                      onRefresh()
                                  }
                              } else {
                                  val updated = tasks.map {
                                      if (it.id == task.id) it.copy(isCompleted = !it.isCompleted) else it
                                  }
                                  StorageHelper.saveTasks(context, updated)
                                  updated.find { it.id == task.id }?.let {
                                      AlarmScheduler.scheduleTaskAlarm(context, it)
                                  }
                                  onRefresh()
                              }
                          },
                          onEdit = {
                              onRunProtected("Edit Task '${task.title}'") {
                                  onEditTask(task)
                              }
                          },
                          onDelete = {
                              onRunProtected("Delete Task '${task.title}'") {
                                  AlarmScheduler.cancelTaskAlarm(context, task.id)
                                  val updated = tasks.filterNot { it.id == task.id }
                                  StorageHelper.saveTasks(context, updated)
                                  onRefresh()
                              }
                          }
                      )
                  }
              }
          }

          @Composable
          fun LeakageAnalyticsSection(
              analytics: LeakageAnalyticsSnapshot,
              screenMinutes: Int,
              screenLimitMins: Int,
              wakeHour: Int,
              wakeMin: Int,
              onLogWakeNow: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Card(
                      shape = RoundedCornerShape(12.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF16222F)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(14.dp)) {
                          Text(
                              "COMPOUNDING MATH: 30-DAY DEEP WORK RECOVERY",
                              fontSize = 12.sp,
                              fontWeight = FontWeight.ExtraBold,
                              color = Color(0xFF90CAF9)
                          )
                          Spacer(modifier = Modifier.height(6.dp))
                          Text(
                              text = "+%.1f Hours Protected".format(analytics.netUpscHoursRecovered30d),
                              fontSize = 24.sp,
                              fontWeight = FontWeight.ExtraBold,
                              color = Color(0xFF81C784)
                          )
                          Text(
                              text = "Eliminating two 15m snoozes + 45m of post-10PM drift saves 37.5h/month of UPSC prep. Below is your real-time leakage math.",
                              fontSize = 11.sp,
                              color = Color.LightGray
                          )
                      }
                  }

                  Card(
                      shape = RoundedCornerShape(10.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1A2129)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(12.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  "1. Morning Wake-Up Variance (Target %02d:%02d)".format(wakeHour, wakeMin),
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 13.sp,
                                  color = Color.White
                              )
                              val todayVarText = when {
                                  analytics.todayWakeVarianceMins == -999 -> "Not checked in today"
                                  analytics.todayWakeVarianceMins <= 0 -> "${-analytics.todayWakeVarianceMins} mins early today"
                                  else -> "+${analytics.todayWakeVarianceMins} mins late today"
                              }
                              Text(
                                  "Today: $todayVarText • 30d Avg Variance: ${analytics.avgWakeVarianceMins}m",
                                  fontSize = 11.sp,
                                  color = Color(0xFFFFD54F)
                              )
                          }
                          OutlinedButton(onClick = onLogWakeNow) {
                              Text("Log Wake", fontSize = 11.sp)
                          }
                      }
                  }

                  Card(
                      shape = RoundedCornerShape(10.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1A2129)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(12.dp)) {
                          Text(
                              "2. The 15-Minute Snooze Leak (1-Snooze Cap Active)",
                              fontWeight = FontWeight.Bold,
                              fontSize = 13.sp,
                              color = Color.White
                          )
                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              "Today Snoozes: ${analytics.todaySnoozeCount} (${analytics.todaySnoozeCount * 15} mins leaked)",
                              fontSize = 12.sp,
                              color = if (analytics.todaySnoozeCount == 0) Color(0xFF81C784) else Color(0xFFFF8A80)
                          )
                          Text(
                              "30-Day Cumulative Snooze Leak: ${analytics.total30DaySnoozes} snoozes (${analytics.snoozeLeakMinutes30d} mins lost)",
                              fontSize = 11.sp,
                              color = Color.LightGray
                          )
                      }
                  }

                  Card(
                      shape = RoundedCornerShape(10.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1A2129)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(12.dp)) {
                          val compliancePct =
                              ((analytics.daysUnderScreenCap.toFloat() / analytics.totalTrackedDays.coerceAtLeast(1)) * 100).toInt()
                          Text(
                              "3. Screen Budget Compliance & Post-Cutoff Drift",
                              fontWeight = FontWeight.Bold,
                              fontSize = 13.sp,
                              color = Color.White
                          )
                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              "Days Under ${screenLimitMins}m Budget: ${analytics.daysUnderScreenCap}/${analytics.totalTrackedDays} ($compliancePct%)",
                              fontSize = 12.sp,
                              color = Color(0xFF90CAF9)
                          )
                          Text(
                              "Today Screen Used: $screenMinutes/${screenLimitMins}m • 30d Post-10PM Drift: ${analytics.postCutoffDriftMins30d}m",
                              fontSize = 11.sp,
                              color = Color.LightGray
                          )
                      }
                  }

                  Spacer(modifier = Modifier.height(24.dp))
              }
          }

          @Composable
          fun CabinAccountabilitySection(
              context: Context,
              cabinSeatId: String,
              cabinManagerName: String,
              cabinCheckInStamp: String,
              cabinDeepMins: Int,
              isSessionActive: Boolean,
              isGuardianLocked: Boolean,
              lastWakeConfirm: String,
              completedToday: Int,
              totalToday: Int,
              habitsDone: Int,
              habitsTotal: Int,
              screenMinutes: Int,
              screenLimitMins: Int,
              tamperCount: Int,
              onUpdateCabinConfig: (String, String) -> Unit,
              onToggleCabinSession: () -> Unit
          ) {
              var showCabinEditModal by remember { mutableStateOf(false) }

              val verificationPayload =
                  "$cabinSeatId|$lastWakeConfirm|$cabinCheckInStamp|$completedToday/$totalToday|$habitsDone/$habitsTotal|$screenMinutes|$tamperCount"
              val verificationHash = GuardianLockManager.shortVerificationCode(verificationPayload)

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Card(
                      shape = RoundedCornerShape(12.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF14261D)),
