              lastWakeConfirm: String,
              tamperCount: Int,
              onOpenGuardian: () -> Unit
          ) {
              Card(
                  shape = RoundedCornerShape(10.dp),
                  colors = CardDefaults.cardColors(
                      containerColor = when {
                          !isGuardianLocked -> Color(0xFF17261C)
                          isMorningWindow -> Color(0xFF152938)
                          else -> Color(0xFF28161B)
                      }
                  ),
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(10.dp),
                      verticalAlignment = Alignment.CenterVertically,
