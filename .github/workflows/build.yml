                  ) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              text = brainModeLabel,
                              fontSize = 11.sp,
                              fontWeight = FontWeight.ExtraBold,
                              color = if (isMorningWindow) Color(0xFF81C784) else Color(0xFFFF8A80)
