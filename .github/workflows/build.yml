name: Build TriFocus IAS APK (Cloud Compiler)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Complete Android Project Structure
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/trifocus/ias

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TriFocusIAS"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.trifocus.ias"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.trifocus.ias"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 4
                  versionName = "4.0-GuardianCabinEdition"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission
                  android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="false"
                  android:label="TriFocus IAS"
                  android:icon="@android:drawable/ic_lock_idle_alarm"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                          <action android:name="android.app.action.SCHEDULE_EXACT_ALARM_PERMISSION_STATE_CHANGED" />
                          <action android:name="com.trifocus.ias.ACTION_MARK_DONE" />
                          <action android:name="com.trifocus.ias.ACTION_SNOOZE_15" />
                          <action android:name="com.trifocus.ias.ACTION_LAZY_ROLLOVER" />
                          <action android:name="com.trifocus.ias.ACTION_WAKE_CONFIRM" />
                          <action android:name="com.trifocus.ias.ACTION_SCREEN_CHECK" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/trifocus/ias/ReminderReceiver.kt
          package com.trifocus.ias

          import android.app.AlarmManager
          import android.app.AppOpsManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.usage.UsageStatsManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.os.PowerManager
          import android.os.Process
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          class ReminderReceiver : BroadcastReceiver() {

              override fun onReceive(context: Context, intent: Intent) {
                  val powerManager = context.getSystemService(Context.POWER_SERVICE) as PowerManager
                  val wakeLock = powerManager.newWakeLock(
                      PowerManager.PARTIAL_WAKE_LOCK,
                      "TriFocusIAS::AlarmWakeLock"
                  )
                  wakeLock.acquire(5000L)

                  try {
                      handleIntent(context, intent)
                  } finally {
                      if (wakeLock.isHeld) {
                          wakeLock.release()
                      }
                  }
              }

              private fun handleIntent(context: Context, intent: Intent) {
                  val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  when (intent.action) {
                      Intent.ACTION_BOOT_COMPLETED,
                      "android.intent.action.QUICKBOOT_POWERON",
                      Intent.ACTION_MY_PACKAGE_REPLACED,
                      AlarmManager.ACTION_SCHEDULE_EXACT_ALARM_PERMISSION_STATE_CHANGED -> {
                          AlarmScheduler.scheduleAllRoutineAlarms(context)
                          return
                      }

                      Intent.ACTION_TIME_CHANGED,
                      Intent.ACTION_TIMEZONE_CHANGED -> {
                          if (GuardianLockManager.isLocked(context)) {
                              GuardianLockManager.recordTamperEvent(context, "System clock/timezone altered while locked")
                          }
                          AlarmScheduler.scheduleAllRoutineAlarms(context)
                          return
                      }

                      "com.trifocus.ias.ACTION_WAKE_CONFIRM" -> {
                          val notifId = intent.getIntExtra("NOTIFICATION_ID", 9000)
                          val varianceMins = StorageHelper.recordMorningWakeCheckIn(context)
                          manager.cancel(notifId)
                          val msg = if (varianceMins <= 0) {
                              "Wake-Up Logged (${-varianceMins}m early)! Morning Planner Window Open."
                          } else {
                              "Wake-Up Logged (+${varianceMins}m variance). Start Optional Block!"
                          }
                          Toast.makeText(context, msg, Toast.LENGTH_LONG).show()
                          return
                      }

                      "com.trifocus.ias.ACTION_MARK_DONE" -> {
                          val taskId = intent.getStringExtra("TASK_ID") ?: return
                          val notifId = intent.getIntExtra("NOTIFICATION_ID", 0)
                          val updated = StorageHelper.loadTasks(context).map {
                              if (it.id == taskId) it.copy(isCompleted = true) else it
                          }
                          StorageHelper.saveTasks(context, updated)
                          AlarmScheduler.cancelTaskAlarm(context, taskId)
                          manager.cancel(notifId)
                          Toast.makeText(context, "Task Marked Done! Deep hours credited.", Toast.LENGTH_SHORT).show()
                          return
                      }

                      "com.trifocus.ias.ACTION_SNOOZE_15" -> {
                          val taskId = intent.getStringExtra("TASK_ID") ?: return
                          val notifId = intent.getIntExtra("NOTIFICATION_ID", 0)
                          val task = StorageHelper.loadTasks(context).find { it.id == taskId } ?: return

                          if (GuardianLockManager.isLocked(context)) {
                              val snoozesUsed = StorageHelper.getSnoozeCountToday(context, taskId)
                              if (snoozesUsed >= 1) {
                                  GuardianLockManager.recordTamperEvent(context, "2nd snooze blocked on '${task.title}'")
                                  Toast.makeText(
                                      context,
                                      "GUARDIAN LOCK: Max 1 snooze allowed per task! Execute now.",
                                      Toast.LENGTH_LONG
                                  ).show()
                                  showNotification(
                                      context = context,
                                      title = "SNOOZE BLOCKED: [${task.category.label}] ${task.title}",
                                      message = "1-Snooze Rule enforced! Stop leaking 15-min blocks and start now.",
                                      id = notifId,
                                      taskId = task.id,
                                      isBedtime = false,
                                      isWakeUp = false
                                  )
                                  return
                              }
                          }

                          StorageHelper.incrementSnoozeCountToday(context, taskId)
                          AlarmScheduler.scheduleSnoozeAlarm(context, task, 15)
                          manager.cancel(notifId)
                          Toast.makeText(context, "Snoozed 15m (15m Snooze Leak Logged)", Toast.LENGTH_SHORT).show()
                          return
                      }

                      "com.trifocus.ias.ACTION_LAZY_ROLLOVER" -> {
                          val notifId = intent.getIntExtra("NOTIFICATION_ID", 9004)
                          StorageHelper.performLazyNightRollover(context)
                          manager.cancel(notifId)
                          Toast.makeText(
                              context,
                              "Tomorrow's Contract Locked! Put your phone away & sleep.",
                              Toast.LENGTH_LONG
                          ).show()
                          return
                      }

                      "com.trifocus.ias.ACTION_SCREEN_CHECK" -> {
                          val prefs = context.getSharedPreferences("trifocus_prefs", Context.MODE_PRIVATE)
                          val limitMins = prefs.getInt("screen_limit_mins", 60)
                          val bedHour = prefs.getInt("bed_hour", 22)
                          val wakeHour = prefs.getInt("wake_hour", 5)
                          val warnThreshold = (limitMins * 0.75).toInt()

                          if (GuardianLockManager.isLocked(context) && !ScreenTimeTracker.hasUsagePermission(context)) {
                              GuardianLockManager.recordTamperEvent(context, "Usage Access permission revoked while locked")
                              showNotification(
                                  context = context,
                                  title = "CHEAT DETECTED: Usage Access Disabled!",
                                  message = "Guardian Lock detected Usage Stats revocation. Re-enable immediately!",
                                  id = 9997,
                                  taskId = null,
                                  isBedtime = false,
                                  isWakeUp = false
                              )
                              AlarmScheduler.scheduleScreenCheckPulse(context)
                              return
                          }

                          val usedMins = ScreenTimeTracker.getTodayScreenMinutes(context)
                          val nowHour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                          if (nowHour >= bedHour || nowHour < wakeHour) {
                              StorageHelper.recordPostCutoffDriftPulse(context, usedMins)
                          }

                          val todayKey = Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                          val lastWarnDay = prefs.getInt("warn_day", -1)

                          if (usedMins >= limitMins) {
                              showNotification(
                                  context = context,
                                  title = "SCREEN LIMIT BREACHED ($usedMins / $limitMins mins)",
                                  message = "You crossed your $limitMins-min daily budget! Lock your phone and return to UPSC prep.",
                                  id = 9999,
                                  taskId = null,
                                  isBedtime = false,
                                  isWakeUp = false
                              )
                          } else if (usedMins in warnThreshold until limitMins && lastWarnDay != todayKey) {
                              prefs.edit().putInt("warn_day", todayKey).apply()
                              showNotification(
                                  context = context,
                                  title = "$usedMins/$limitMins Mins Screen Time Used",
                                  message = "Only ${limitMins - usedMins} mins of screen budget left today. Keep your phone locked!",
                                  id = 9998,
                                  taskId = null,
                                  isBedtime = false,
                                  isWakeUp = false
                              )
                          }
                          AlarmScheduler.scheduleScreenCheckPulse(context)
                          return
                      }
                  }

                  val title = intent.getStringExtra("TITLE") ?: "TriFocus IAS Reminder"
                  val message = intent.getStringExtra("MESSAGE") ?: "Stay on track with your daily blocks!"
                  val notificationId = intent.getIntExtra("NOTIFICATION_ID", 1001)
                  val taskId = intent.getStringExtra("TASK_ID")
                  val isBedtime = intent.getBooleanExtra("IS_BEDTIME", false)
                  val isWakeUp = intent.getBooleanExtra("IS_WAKEUP", false)

                  showNotification(context, title, message, notificationId, taskId, isBedtime, isWakeUp)

                  val recurringHour = intent.getIntExtra("RECURRING_HOUR", -1)
                  val recurringMin = intent.getIntExtra("RECURRING_MIN", -1)
                  if (recurringHour != -1 && recurringMin != -1) {
                      AlarmScheduler.scheduleExactDaily(
                          context = context,
                          hour = recurringHour,
                          minute = recurringMin,
                          requestCode = notificationId,
                          title = title,
                          message = message,
                          isBedtime = isBedtime,
                          isWakeUp = isWakeUp,
                          forceNextDay = true
                      )
                  }
              }

              private fun showNotification(
                  context: Context,
                  title: String,
                  message: String,
                  id: Int,
                  taskId: String?,
                  isBedtime: Boolean,
                  isWakeUp: Boolean
              ) {
                  val channelId = "trifocus_guardian_alarm_v4"
                  val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  val alarmSound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)

                  val channel = NotificationChannel(
                      channelId,
                      "TriFocus IAS Guardian Alarms",
                      NotificationManager.IMPORTANCE_HIGH
                  ).apply {
                      description = "Exact task alarms, morning wake-up, 10:00 PM sleep cutoff, and anti-cheat alerts"
                      enableVibration(true)
                      vibrationPattern = longArrayOf(0, 600, 250, 600, 250, 800)
                      lockscreenVisibility = android.app.Notification.VISIBILITY_PUBLIC
                      setBypassDnd(true)
                      val audioAttrs = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()
                      setSound(alarmSound, audioAttrs)
                  }
                  manager.createNotificationChannel(channel)
                  
