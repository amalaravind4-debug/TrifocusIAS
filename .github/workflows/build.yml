          @Composable
          fun ScreenTimeBudgetCard(
              hasPermission: Boolean,
              usedMinutes: Int,
              limitMinutes: Int,
              onGrantPermission: () -> Unit
          ) {
              val ratio = (usedMinutes.toFloat() / limitMinutes.coerceAtLeast(1)).coerceIn(0f, 1f)
              val barColor = when {
                  usedMinutes >= limitMinutes -> Color(0xFFEF5350)
                  usedMinutes >= (limitMinutes * 0.75).toInt() -> Color(0xFFFFCA28)
                  else -> Color(0xFF66BB6A)
              }

              Card(
                  shape = RoundedCornerShape(12.dp),
                  colors = CardDefaults.cardColors(containerColor = Color(0xFF1A2129)),
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Column(modifier = Modifier.padding(12.dp)) {
                      if (!hasPermission) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      "$limitMinutes-Min Daily Screen Time Guard",
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 13.sp,
                                      color = Color(0xFFFFD54F)
                                  )
                                  Text(
                                      "Grant Usage Access so TriFocus enforces your daily screen cap.",
                                      fontSize = 11.sp,
                                      color = Color.Gray
                                  )
                              }
                              OutlinedButton(onClick = onGrantPermission) {
                                  Text("Enable", fontSize = 12.sp)
                              }
                          }
                      } else {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = if (usedMinutes >= limitMinutes)
                                      "SCREEN LIMIT EXCEEDED — LOCK PHONE!"
                                  else
                                      "Daily Screen Budget (Locked Cap: ${limitMinutes}m)",
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = barColor
                              )
                              Text(
                                  text = "$usedMinutes / $limitMinutes mins",
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = Color.White
                              )
                          }
                          Spacer(modifier = Modifier.height(6.dp))
                          LinearProgressIndicator(
                              progress = { ratio },
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(7.dp),
                              color = barColor,
                              trackColor = Color(0xFF2C3540)
                          )
                      }
                  }
              }
          }

