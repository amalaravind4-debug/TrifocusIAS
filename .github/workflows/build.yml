          @Composable
          fun ZeroCheatProtocolAndAuditSection(
              context: Context,
              hasUsageAccess: Boolean,
              isBatteryUnrestricted: Boolean,
              isGuardianLocked: Boolean,
              partnerName: String,
              wakeHour: Int,
              wakeMin: Int,
              bedHour: Int,
              bedMin: Int,
              screenLimitMins: Int,
              tamperCount: Int,
              lastTamperLog: String,
              lastSundayAudit: String,
              analytics: LeakageAnalyticsSnapshot,
              completedToday: Int,
              totalToday: Int,
              cabinSeatId: String,
              cabinDeepMins: Int,
              onOpenGuardianModal: () -> Unit,
              onPartnerSignOffSunday: () -> Unit
          ) {
              val step1Done = hasUsageAccess && isBatteryUnrestricted
              val step2Done = isGuardianLocked
              val step3Done = isGuardianLocked && GuardianLockManager.isBrainSplitEnforced(context)

              val auditCode = GuardianLockManager.shortVerificationCode(
                  "$partnerName|$tamperCount|${analytics.netUpscHoursRecovered30d}|$lastSundayAudit"
              )

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Card(
                      shape = RoundedCornerShape(12.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1A2129)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text(
                              "4-STEP ZERO-CHEAT HANDOVER PLAYBOOK",
                              fontSize = 12.sp,
                              fontWeight = FontWeight.ExtraBold,
                              color = Color(0xFFFFD54F)
                          )

                          ProtocolStepRow(
                              stepNumber = 1,
                              title = "Grant System Locks (Usage Access + Unrestricted Battery)",
                              subtitle = if (step1Done) "Active — OEM battery killers cannot silence alarms"
                              else "Incomplete — Grant both permissions on Planner tab",
                              isDone = step1Done
                          )

                          ProtocolStepRow(
                              stepNumber = 2,
                              title = "Lock 3 Non-Negotiable Anchors with Partner Password",
                              subtitle = "Wake %02d:%02d • Sleep %02d:%02d • Screen Cap %dm (%s)".format(
                                  wakeHour, wakeMin, bedHour, bedMin, screenLimitMins,
                                  if (step2Done) "Locked by $partnerName" else "Unlocked"
                              ),
                              isDone = step2Done
                          )

                          ProtocolStepRow(
                              stepNumber = 3,
                              title = "Enforce 1-Snooze Rule & 6AM/10PM Brain Split",
                              subtitle = if (step3Done) "Armed — Max 1 snooze/task & 10PM renegotiation blocked"
                              else "Arm Guardian Lock to enforce 1-Snooze & Brain Split",
                              isDone = step3Done
                          )

                          ProtocolStepRow(
                              stepNumber = 4,
                              title = "Run 60-Second Sunday Partner Audit",
                              subtitle = "Last Signed Off: $lastSundayAudit",
                              isDone = tamperCount == 0 && isGuardianLocked
                          )
                      }
                  }

                  Card(
                      shape = RoundedCornerShape(12.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF23171B)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  "60-SECOND SUNDAY AUDIT REPORT",
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.ExtraBold,
                                  color = Color(0xFFFF8A80)
                              )
                              Text(
                                  "AUDIT #$auditCode",
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = Color(0xFFFFD54F)
                              )
                          }

                          Text("Accountability Partner: $partnerName", fontSize = 12.sp, color = Color.White)
                          Text(
                              "Tamper / Cheat Events: $tamperCount ($lastTamperLog)",
                              fontSize = 12.sp,
                              color = if (tamperCount == 0) Color(0xFF81C784) else Color(0xFFFF8A80),
                              fontWeight = FontWeight.Bold
                          )
                          Text("Avg Wake Variance: ${analytics.avgWakeVarianceMins} mins", fontSize = 12.sp, color = Color.White)
                          Text("30d Snoozes Used: ${analytics.total30DaySnoozes} (${analytics.snoozeLeakMinutes30d}m leaked)", fontSize = 12.sp, color = Color.White)
                          Text("Screen Cap Compliance: ${analytics.daysUnderScreenCap}/${analytics.totalTrackedDays} days under ${screenLimitMins}m", fontSize = 12.sp, color = Color.White)
                          Text(
                              "Net Deep UPSC Hours Protected (30d): +%.1f hrs".format(analytics.netUpscHoursRecovered30d),
                              fontSize = 12.sp,
                              color = Color(0xFF81C784),
                              fontWeight = FontWeight.Bold
                          )

                          Spacer(modifier = Modifier.height(6.dp))

                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedButton(
                                  onClick = {
                                      val report = buildString {
                                          appendLine("🛡️ *TRIFOCUS IAS • 60-SECOND SUNDAY AUDIT*")
                                          appendLine("Partner: $partnerName | Audit Code: #$auditCode")
                                          appendLine("Tamper Events: $tamperCount ($lastTamperLog)")
                                          appendLine("Avg Wake Variance: ${analytics.avgWakeVarianceMins}m")
                                          appendLine("30d Snooze Leak: ${analytics.snoozeLeakMinutes30d}m (${analytics.total30DaySnoozes} snoozes)")
                                          appendLine("Days Under ${screenLimitMins}m Cap: ${analytics.daysUnderScreenCap}/${analytics.totalTrackedDays}")
                                          appendLine("Cabin Seat: $cabinSeatId (Today: ${cabinDeepMins}m, Tasks: $completedToday/$totalToday)")
                                          appendLine("Net UPSC Hours Protected: +%.1f hrs".format(analytics.netUpscHoursRecovered30d))
                                      }
                                      val intent = Intent(Intent.ACTION_SEND).apply {
                                          type = "text/plain"
                                          putExtra(Intent.EXTRA_TEXT, report)
                                      }
                                      context.startActivity(Intent.createChooser(intent, "Share Sunday Audit Report"))
                                  },
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Text("Share Audit", fontSize = 11.sp)
                              }

                              Button(
                                  onClick = {
                                      if (!isGuardianLocked) {
                                          onOpenGuardianModal()
                                      } else {
                                          onPartnerSignOffSunday()
                                      }
                                  },
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Text(
                                      if (isGuardianLocked) "Partner Sign-Off" else "Arm Lock First",
                                      fontSize = 11.sp
                                  )
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(24.dp))
              }
          }

